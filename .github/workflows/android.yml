name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Broken HTML Fragment in Sidebar.svelte
        run: |
          cat << 'PYEOF' > fix_sidebar.py
          import os

          sidebar_path = "frontend/src/components/Sidebar.svelte"
          if os.path.exists(sidebar_path):
              with open(sidebar_path, "r", encoding="utf-8") as f:
                  sb = f.read()

              # Вырезаем оборванный кусок старых модалок между концом десктопной ленты Сторис и <div class="contacts-list">
              start_marker = '<span style="font-size: 11px; color: #9AA0A6; margin-top: 4px; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{st.author}</span>\n            </div>\n        {/each}\n    </div>'
              end_marker = '<div class="contacts-list">'

              if start_marker in sb and end_marker in sb:
                  idx1 = sb.find(start_marker) + len(start_marker)
                  idx2 = sb.find(end_marker, idx1)
                  if idx2 != -1:
                      sb = sb[:idx1] + "\n\n        " + sb[idx2:]
                      with open(sidebar_path, "w", encoding="utf-8") as f:
                          f.write(sb)
                      print("[OK] Оборванный HTML-хвост в Sidebar.svelte успешно удалён")
          PYEOF
          python3 fix_sidebar.py
          rm -f fix_sidebar.py

      - name: Commit clean Sidebar.svelte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Clean leftover HTML fragment in Sidebar.svelte [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
