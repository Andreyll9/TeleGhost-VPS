name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cleanly Replace toggleVoiceOrCircle in Chat.svelte Without Regex
        run: |
          cat << 'PYEOF' > fix_chat_exact.py
          import os

          chat_path = "frontend/src/components/Chat.svelte"
          if os.path.exists(chat_path):
              with open(chat_path, "r", encoding="utf-8") as f:
                  ch = f.read()

              if "import * as AppActions" not in ch:
                  ch = ch.replace("import { Icons }", "import * as AppActions from '../../wailsjs/go/main/App.js';\n    import { Icons }", 1)

              fn_marker = "async function toggleVoiceOrCircle(mode)"
              script_end = "</script>"

              idx1 = ch.find(fn_marker)
              idx2 = ch.find(script_end, idx1)

              if idx1 != -1 and idx2 != -1:
                  clean_fn = """async function toggleVoiceOrCircle(mode) {
                  if (isRecordingMedia && mediaRecorderInstance) {
                      clearInterval(recordingInterval);
                      if (window.__addHydraLog) window.__addHydraLog('MEDIA-REC', 'Остановка записи ' + recordMode + ' (' + recordingSeconds + ' сек)');
                      mediaRecorderInstance.stop();
                      isRecordingMedia = false;
                      return;
                  }
                  recordMode = mode;
                  try {
                      if (window.__addHydraLog) window.__addHydraLog('MEDIA-REC', 'Запрос микрофона/камеры для ' + mode);
                      const stream = await navigator.mediaDevices.getUserMedia({
                          audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 },
                          video: mode === 'video' ? { facingMode: 'user', width: { ideal: 180 }, height: { ideal: 180 }, frameRate: { ideal: 15 } } : false
                      });
                      recordedChunks = [];
                      const options = mode === 'video'
                          ? { videoBitsPerSecond: 96000, audioBitsPerSecond: 16000 }
                          : { audioBitsPerSecond: 16000 };
                      try {
                          mediaRecorderInstance = new MediaRecorder(stream, options);
                      } catch (e) {
                          mediaRecorderInstance = new MediaRecorder(stream);
                      }
                      mediaRecorderInstance.ondataavailable = (e) => {
                          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                      };
                      mediaRecorderInstance.onstop = () => {
                          stream.getTracks().forEach(t => t.stop());
                          const mime = recordMode === 'video' ? 'video/webm' : 'audio/webm';
                          const blob = new Blob(recordedChunks, { type: mime });
                          if (window.__addHydraLog) window.__addHydraLog('MEDIA-BLOB', `Готов ${mime}, размер: ${blob.size} байт`);
                          const reader = new FileReader();
                          reader.onloadend = async () => {
                              const base64Url = reader.result;
                              const payload = recordMode === 'video'
                                  ? `[HYDRA_CIRCLE]:${base64Url}`
                                  : `[HYDRA_VOICE]:${base64Url}`;
                              try {
                                  const targetId = selectedContact?.ID || selectedContact?.ChatID;
                                  if (window.__addHydraLog) window.__addHydraLog('MEDIA-SEND', `Отправка медиа в чат ${targetId} (${payload.length} симв.)`);
                                  await AppActions.SendText(targetId, payload, '');
                                  dispatch('refreshMessages');
                              } catch (sendErr) {
                                  if (window.__addHydraLog) window.__addHydraLog('MEDIA-ERR', String(sendErr));
                                  alert('Ошибка отправки медиа: ' + sendErr);
                              }
                          };
                          reader.readAsDataURL(blob);
                      };
                      recordingSeconds = 0;
                      recordingInterval = setInterval(() => {
                          recordingSeconds++;
                          if (recordingSeconds >= 30 && isRecordingMedia && mediaRecorderInstance) {
                              clearInterval(recordingInterval);
                              mediaRecorderInstance.stop();
                              isRecordingMedia = false;
                          }
                      }, 1000);
                      mediaRecorderInstance.start(250);
                      isRecordingMedia = true;
                  } catch (err) {
                      if (window.__addHydraLog) window.__addHydraLog('MEDIA-PERM-ERR', String(err));
                      alert('Разрешите доступ к микрофону и камере: ' + err);
                  }
              }"""
                  ch = ch[:idx1] + clean_fn + "\n</script>" + ch[idx2 + len(script_end):]
                  with open(chat_path, "w", encoding="utf-8") as f:
                      f.write(ch)
                  print("[OK] Chat.svelte: функция toggleVoiceOrCircle чисто перезаписана до самого </script>!")
          PYEOF
          python3 fix_chat_exact.py
          rm -f fix_chat_exact.py
          gofmt -w internal/ mobile/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Clean Chat.svelte to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Cleanly replace toggleVoiceOrCircle up to </script> in Chat.svelte [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
