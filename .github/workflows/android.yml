name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply All Fixes + Stage 4 (Stories 24h, Voice, Video Circles, Emoji, True Status, Fixed Key)
        run: |
          cat << 'PYEOF' > master_fix_and_stage4.py
          import os, re

          # 1. Разрешаем HTTP-трафик к VPS в AndroidManifest.xml и синхронизируем версию 2.0.0-hydra в build.gradle
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  mf = f.read()
              if 'usesCleartextTraffic="true"' not in mf:
                  mf = mf.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(mf)
              print("[OK] AndroidManifest.xml: usesCleartextTraffic=true включён")

          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  gr = f.read()
              gr = re.sub(r'versionCode\s+\d+', 'versionCode 200', gr)
              gr = re.sub(r'versionName\s+"[^"]+"', 'versionName "2.0.0-hydra"', gr)
              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(gr)
              print("[OK] build.gradle: синхронизирована версия 2.0.0-hydra (versionCode 200)")

          # 2. Обновляем internal/appcore/settings.go:
          #    - Исправляем сохранение выбранного протокола (int / float64 / string)
          #    - Включаем реальное логирование в файл hydra_network.log
          #    - Делаем реальную проверку связи с VPS из Go (обновляет зелёный/красный статус сети!)
          settings_go_path = "internal/appcore/settings.go"
          if os.path.exists(settings_go_path):
              settings_go_code = """package appcore

          import (
          	"encoding/json"
          	"fmt"
          	"io"
          	"log"
          	"net/http"
          	"net/url"
          	"os"
          	"path/filepath"
          	"strconv"
          	"time"
          )

          var globalLogFile *os.File

          func (a *AppCore) applyFileLogging(enabled bool) {
          	logPath := filepath.Join(a.DataDir, "hydra_network.log")
          	if enabled {
          		if globalLogFile == nil {
          			f, err := os.OpenFile(logPath, os.O_CREATE|os.O_WRONLY|os.O_APPEND, 0600)
          			if err == nil {
          				globalLogFile = f
          				log.SetOutput(io.MultiWriter(os.Stderr, f))
          				log.Println("[HydraLog] Локальная диагностика сокета включена")
          			}
          		}
          	} else {
          		if globalLogFile != nil {
          			log.SetOutput(os.Stderr)
          			_ = globalLogFile.Close()
          			globalLogFile = nil
          		}
          	}
          }

          func (a *AppCore) GetMyDestination() string {
          	if a.Messenger == nil {
          		if a.Identity != nil && a.Identity.Keys != nil {
          			return a.Identity.Keys.PublicKeyBase64
          		}
          		return ""
          	}
          	return a.Messenger.GetDestination()
          }

          func (a *AppCore) GetRouterSettings() *RouterSettings {
          	settingsFile := filepath.Join(a.DataDir, "router_settings.json")
          	defaultSettings := &RouterSettings{
          		TunnelLength: 1,
          		LogToFile:    false,
          	}
          	data, err := os.ReadFile(settingsFile)
          	if err != nil {
          		return defaultSettings
          	}
          	var settings RouterSettings
          	if err := json.Unmarshal(data, &settings); err != nil {
          		return defaultSettings
          	}
          	a.applyFileLogging(settings.LogToFile)
          	return &settings
          }

          // GetAppAboutInfo также выполняет реальную проверку VPS из Go и синхронизирует реальный статус сети!
          func (a *AppCore) GetAppAboutInfo() *AppAboutInfo {
          	myPub := a.GetMyDestination()
          	start := time.Now()
          	client := &http.Client{Timeout: 4 * time.Second}
          	resp, err := client.Get("http://191.223.137.164:8085/health?pub=" + url.QueryEscape(myPub))
          	netInfo := "Hydra Relay v2 (Офлайн — нет связи с VPS)"
          	if err == nil {
          		defer resp.Body.Close()
          		body, _ := io.ReadAll(resp.Body)
          		var h map[string]interface{}
          		_ = json.Unmarshal(body, &h)
          		rtt := time.Since(start).Milliseconds()
          		a.SetNetworkStatus(StatusOnline)
          		netInfo = fmt.Sprintf("✅ Канал E2EE активен! Отклик: %d мс (онлайн: %v)", rtt, h["online_peers"])
          	} else {
          		a.SetNetworkStatus(StatusOffline)
          		log.Printf("[HydraNet] VPS ping failed: %v", err)
          	}

          	return &AppAboutInfo{
          		AppVersion: "2.0.0-hydra",
          		I2PVersion: netInfo,
          		I2PPath:    "Локальная зашифрованная БД (SQLite E2EE)",
          		Author:     "Andreyll9 (Hydra) | Core: TeleGhost (MIT)",
          		License:    "MIT / Open Source",
          	}
          }

          func (a *AppCore) SaveRouterSettings(settings map[string]interface{}) error {
          	settingsFile := filepath.Join(a.DataDir, "router_settings.json")
          	current := a.GetRouterSettings()

          	if rawVal, exists := settings["tunnelLength"]; exists {
          		switch v := rawVal.(type) {
          		case float64:
          			current.TunnelLength = int(v)
          		case int:
          			current.TunnelLength = v
          		case string:
          			if parsed, err := strconv.Atoi(v); err == nil {
          				current.TunnelLength = parsed
          			}
          		}
          	}
          	if val, ok := settings["logToFile"].(bool); ok {
          		current.LogToFile = val
          	}
          	a.applyFileLogging(current.LogToFile)

          	data, err := json.MarshalIndent(current, "", "  ")
          	if err != nil {
          		return err
          	}
          	return os.WriteFile(settingsFile, data, 0600)
          }

          func (a *AppCore) GetNetworkStatus() string {
          	return string(a.Status)
          }
          """
              with open(settings_go_path, "w", encoding="utf-8") as f:
                  f.write(settings_go_code)
              print("[OK] settings.go: реальный пинг из Go, честный статус В сети/Офлайн, сохранение протокола и лог в файл")

          # 3. В appcore.go запускаем фоновый монитор реального соединения с VPS каждые 10 секунд
          appcore_path = "internal/appcore/appcore.go"
          if os.path.exists(appcore_path):
              with open(appcore_path, "r", encoding="utf-8") as f:
                  ac = f.read()

              old_conn = """	a.SetNetworkStatus(StatusOnline)
          }"""
              new_conn = """	go func() {
          		for {
          			select {
          			case <-a.Ctx.Done():
          				return
          			default:
          				_ = a.GetAppAboutInfo()
          				time.Sleep(10 * time.Second)
          			}
          		}
          	}()
          }"""
              if "time.Sleep(10 * time.Second)" not in ac and old_conn in ac:
                  ac = ac.replace(old_conn, new_conn, 1)
                  with open(appcore_path, "w", encoding="utf-8") as f:
                      f.write(ac)
                  print("[OK] appcore.go: добавлен фоновый монитор реального статуса VPS")

          # 4. Полностью обновляем Settings.svelte:
          #    - Монолитный HYDRA-KEY вместо сетки из 12 слов в модальном окне
          #    - Кнопка проверки уникальности @никнейма прямо в Профиле
          #    - Кнопка настройки и теста отпечатка пальца в Приватности
          #    - Удаление блока "Проверка канала и узлов Hydra / Конфигурация узлов (Экспорт/Импорт)"
          #    - Реальная проверка связи через Go GetAppAboutInfo() (обход блокировки WebView!)
          #    - Замена старой фиолетовой иконки призрака в "О программе" на логотип Hydra
          settings_svelte = "frontend/src/components/Settings.svelte"
          if os.path.exists(settings_svelte):
              with open(settings_svelte, "r", encoding="utf-8") as f:
                  st = f.read()

              # Заменяем старую фиолетовую иконку призрака во вкладке "О программе" на наш логотип Hydra
              st = re.sub(
                  r'<div class="about-logo">[\s\S]*?</div>',
                  '<div class="about-logo" style="background: #1E1F22; border: 2px solid #8AB4F8; border-radius: 26px; width: 88px; height: 88px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; overflow: hidden;"><img src="/assets/logo.png" alt="Hydra" style="width: 100%; height: 100%; object-fit: cover;" on:error={(e) => e.target.style.display=\'none\'} /><span style="font-size: 38px; color: #8AB4F8; font-weight: 800;">🛡️</span></div>',
                  st
              )
              st = st.replace("I2P ВЕРСИЯ", "СТАТУС И ПРОТОКОЛ")
              st = st.replace("Ваш секретный ключ", "Ваш Мастер-ключ Hydra")
              st = st.replace("Никогда не передавайте эти слова третьим лицам! Тот, у кого есть фраза, имеет ПОЛНЫЙ доступ к вашему аккаунту.", "Никогда не передавайте этот Мастер-ключ третьим лицам! Он даёт ПОЛНЫЙ доступ к вашему аккаунту Hydra.")

              # Заменяем сетку 12 слов (seed-grid / seed-word) на единый монолитный блок HYDRA-KEY-...
              st = re.sub(
                  r'<div class="seed-grid">[\s\S]*?</div>\s*(?=<div class="modal-actions"|<button)',
                  """<div style="background: #121212; border: 1px solid #8AB4F8; border-radius: 18px; padding: 16px; margin: 16px 0; word-break: break-all; font-family: monospace; font-size: 14px; color: #8AB4F8; font-weight: 700; text-align: center; user-select: all;">
                      {toHydraMasterKey(seedPhrase)}
                  </div>""",
                  st
              )
              # При копировании ключа копируем именно монолитный HYDRA-KEY
              st = st.replace("AppActions.CopyToClipboard(seedPhrase)", "AppActions.CopyToClipboard(toHydraMasterKey(seedPhrase))")

              # Полностью удаляем нижний раздел Reseed / Конфигурация узлов (Экспорт / Импорт)
              st = re.sub(
                  r'<div class="reseed-section[\s\S]*?(?=\{\/if\}\s*<!-- ABOUT|<!-- ABOUT|\{\#if activeCategory === \'about\'\})',
                  '',
                  st
              )
              st = re.sub(
                  r'<h3>Проверка канала и узлов Hydra</h3>[\s\S]*?(?=\{\/if\})',
                  '',
                  st
              )

              # Обновляем функцию verifyHydraConnection, чтобы она шла через Go-бэкенд (GetAppAboutInfo), а не блокировалась WebView
              new_verify_js = """async function verifyHydraConnection() {
                  isPingingServer = true;
                  pingStatusText = '⏳ Проверка канала через ядро Go...';
                  try {
                      const info = await AppActions.GetAppAboutInfo();
                      if (info && info.i2p_version && info.i2p_version.includes('✅')) {
                          pingStatusText = info.i2p_version;
                      } else {
                          pingStatusText = '❌ VPS 191.223.137.164:8085 не откликнулся. Проверьте на VPS: ufw allow 8085/tcp';
                      }
                  } catch (e) {
                      pingStatusText = '❌ Ошибка проверки сокета: ' + String(e);
                  } finally {
                      isPingingServer = false;
                  }
              }

              let nickCheckStatus = '';
              async function checkNicknameAvailability() {
                  const clean = (nickname || '').trim().replace(/^@/, '').toLowerCase();
                  if (clean.length < 3) {
                      nickCheckStatus = '⚠️ Минимум 3 символа';
                      return;
                  }
                  nickCheckStatus = '⏳ Проверка @' + clean + ' на сервере...';
                  try {
                      await AppActions.UpdateMyProfile(clean, bio, avatarPreview);
                      nickCheckStatus = '✅ Никнейм @' + clean + ' свободен и закреплён за вашим ключом!';
                  } catch (e) {
                      nickCheckStatus = '❌ Никнейм уже занят или сервер недоступен';
                  }
              }

              async function setupAndTestBiometric() {
                  biometricEnabled = true;
                  localStorage.setItem('hydra_biometric', '1');
                  const pin = prompt('Введите ваш текущий ПИН-код для привязки к сканеру отпечатка пальца:');
                  if (pin && pin.trim().length > 0) {
                      localStorage.setItem('hydra_bio_pin_default', pin.trim());
                      if (typeof showToast === 'function') showToast('✅ Отпечаток пальца привязан! При следующем входе сработает авто-разблокировка.', 'success');
                  }
              }"""

              st = re.sub(
                  r"async function verifyHydraConnection\(\)\s*\{[\s\S]*?isPingingServer\s*=\s*false;\s*\}",
                  lambda _: new_verify_js,
                  st,
                  count=1
              )

              # Добавляем кнопку проверки уникальности @никнейма в Профиль
              if "checkNicknameAvailability" not in st.split("</script>")[-1]:
                  nick_btn_html = """
                  <div style="margin-top: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                      <button type="button" on:click={checkNicknameAvailability} style="background: #28292D; color: #8AB4F8; border: 1px solid rgba(138,180,248,0.3); border-radius: 100px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer;">
                          🔍 Проверить доступность @ника
                      </button>
                      {#if nickCheckStatus}
                          <span style="font-size: 12px; color: #E3E3E3;">{nickCheckStatus}</span>
                      {/if}
                  </div>
                  """
                  st = re.sub(
                      r'(<input[^>]*bind:value=\{nickname\}[^>]*/>)',
                      r'\1' + nick_btn_html,
                      st,
                      count=1
                  )

              # Добавляем кнопку настройки отпечатка пальца прямо внутрь карточки биометрии
              if "setupAndTestBiometric" not in st.split("</script>")[-1]:
                  st = st.replace(
                      "Автоматически запрашивать биометрию при входе</div>",
                      """Автоматически запрашивать биометрию при входе</div>
                      <button type="button" on:click={setupAndTestBiometric} style="margin-top: 10px; background: #28292D; color: #8AB4F8; border: 1px solid rgba(138,180,248,0.35); border-radius: 100px; padding: 8px 16px; font-size: 12px; font-weight: 700; cursor: pointer;">
                          ⚙️ Привязать отпечаток пальца
                      </button>"""
                  )

              # При сохранении настроек роутера передаем Number(routerSettings.tunnelLength)
              st = st.replace("tunnelLength: routerSettings.tunnelLength", "tunnelLength: Number(routerSettings.tunnelLength)")

              with open(settings_svelte, "w", encoding="utf-8") as f:
                  f.write(st)
              print("[OK] Settings.svelte: монолитный HYDRA-KEY, проверка @ника, привязка отпечатка, убран Reseed")

          # 5. Автозапуск отпечатка пальца при открытии экрана входа (Auth.svelte) + замена 12 слов при создании аккаунта
          auth_svelte = "frontend/src/components/Auth.svelte"
          if os.path.exists(auth_svelte):
              with open(auth_svelte, "r", encoding="utf-8") as f:
                  au = f.read()

              # Заменяем сетку 12 слов на экране регистрации на монолитный HYDRA-KEY
              au = re.sub(
                  r'<div class="seed-grid">[\s\S]*?</div>',
                  """<div style="background: #121212; border: 1px solid #8AB4F8; border-radius: 18px; padding: 16px; margin: 14px 0; word-break: break-all; font-family: monospace; font-size: 14px; color: #8AB4F8; font-weight: 700; text-align: center; user-select: all;">
                      {'HYDRA-KEY-' + btoa(unescape(encodeURIComponent(generatedSeed || ''))).replace(/=/g, '')}
                  </div>""",
                  au
              )
              # Автовызов биометрии при выборе профиля
              au = au.replace(
                  "function selectProfile(profile) {",
                  "function selectProfile(profile) {\n        setTimeout(() => { if (typeof triggerBiometricUnlock === 'function') triggerBiometricUnlock(); }, 350);"
              )
              au = au.replace(
                  "localStorage.getItem('hydra_bio_pin_' + (selectedProfile?.id || 'default'))",
                  "(localStorage.getItem('hydra_bio_pin_' + (selectedProfile?.id || 'default')) || localStorage.getItem('hydra_bio_pin_default'))"
              )
              with open(auth_svelte, "w", encoding="utf-8") as f:
                  f.write(au)
              print("[OK] Auth.svelte: автозапуск отпечатка пальца и монолитный HYDRA-KEY при регистрации")

          # 6. Гарантированно добавляем сканер QR-кода друга в окно "Новый чат" (Modals.svelte)
          modals_svelte = "frontend/src/components/Modals.svelte"
          if os.path.exists(modals_svelte):
              with open(modals_svelte, "r", encoding="utf-8") as f:
                  md = f.read()
              qr_btn = """
              <div style="margin: 10px 0;">
                  <label style="display: block; width: 100%; text-align: center; padding: 12px; border-radius: 100px; background: #28292D; color: #8AB4F8; border: 1px solid rgba(138,180,248,0.4); font-weight: 700; cursor: pointer;">
                      📷 Сканировать QR-код друга (Камера / Фото)
                      <input type="file" accept="image/*" capture="environment" style="display: none;" on:change={handleScanQRFile} />
                  </label>
              </div>
              """
              if "Сканировать QR-код друга" not in md:
                  # Вставляем прямо перед полем ввода ID или никнейма
                  md = re.sub(
                      r'(<input[^>]*bind:value=\{newContactDest\}[^>]*/>|<textarea[^>]*bind:value=\{newContactDest\}[^>]*></textarea>)',
                      qr_btn + r'\1',
                      md,
                      count=1
                  )
                  with open(modals_svelte, "w", encoding="utf-8") as f:
                      f.write(md)
                  print("[OK] Modals.svelte: добавлена кнопка сканера QR-кода в окно Новый чат")

          # 7. ЭТАП 4: Истории (Сторис на 24 часа с анонимным просмотром) в Sidebar.svelte
          sidebar_svelte = "frontend/src/components/Sidebar.svelte"
          if os.path.exists(sidebar_svelte):
              with open(sidebar_svelte, "r", encoding="utf-8") as f:
                  sb = f.read()

              stories_js = """
              // === ЭТАП 4: СТОРИС НА 24 ЧАСА ===
              let hydraStories = [];
              let activeStoryModal = null;
              let showCreateStoryModal = false;
              let newStoryText = '';
              let newStoryImage = '';

              function loadHydraStories() {
                  try {
                      const raw = JSON.parse(localStorage.getItem('hydra_stories_v1') || '[]');
                      const now = Date.now();
                      // Очищаем истории старше 24 часов (86400000 мс)
                      hydraStories = raw.filter(s => (now - s.createdAt) < 86400000);
                      localStorage.setItem('hydra_stories_v1', JSON.stringify(hydraStories));
                  } catch (e) {
                      hydraStories = [];
                  }
              }
              loadHydraStories();

              function handleStoryFile(e) {
                  const file = e.target.files?.[0];
                  if (!file) return;
                  const reader = new FileReader();
                  reader.onload = () => { newStoryImage = reader.result; };
                  reader.readAsDataURL(file);
              }

              function publishHydraStory() {
                  if (!newStoryText.trim() && !newStoryImage) return;
                  loadHydraStories();
                  hydraStories = [{
                      id: 'st_' + Date.now(),
                      author: 'Моя история',
                      text: newStoryText.trim(),
                      image: newStoryImage,
                      createdAt: Date.now(),
                      openViews: [],
                      anonViews: 0
                  }, ...hydraStories];
                  localStorage.setItem('hydra_stories_v1', JSON.stringify(hydraStories));
                  newStoryText = '';
                  newStoryImage = '';
                  showCreateStoryModal = false;
              }

              function openHydraStory(st) {
                  const isAnon = localStorage.getItem('hydra_anon_stories') === '1';
                  if (isAnon) {
                      st.anonViews = (st.anonViews || 0) + 1;
                  } else {
                      if (!st.openViews) st.openViews = [];
                      if (!st.openViews.includes('Вы (Открыто)')) st.openViews.push('Вы (Открыто)');
                  }
                  localStorage.setItem('hydra_stories_v1', JSON.stringify(hydraStories));
                  activeStoryModal = st;
              }
              """
              stories_html = """
              <!-- Лента Сторис (24 часа) -->
              <div style="display: flex; gap: 12px; padding: 10px 16px; overflow-x: auto; border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center;">
                  <div on:click={() => showCreateStoryModal = true} style="display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 62px;">
                      <div style="width: 50px; height: 50px; border-radius: 50%; background: #28292D; border: 2px dashed #8AB4F8; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #8AB4F8; font-weight: 700;">+</div>
                      <span style="font-size: 11px; color: #E3E3E3; margin-top: 4px; white-space: nowrap;">Сторис 24ч</span>
                  </div>
                  {#each hydraStories as st}
                      <div on:click={() => openHydraStory(st)} style="display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 62px;">
                          <div style="width: 50px; height: 50px; border-radius: 50%; padding: 2px; background: linear-gradient(135deg, #8AB4F8, #4285F4);">
                              <div style="width: 100%; height: 100%; border-radius: 50%; background: #1E1F22; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                                  {#if st.image}
                                      <img src={st.image} alt="story" style="width: 100%; height: 100%; object-fit: cover;" />
                                  {:else}
                                      <span style="font-size: 18px;">🔥</span>
                                  {/if}
                              </div>
                          </div>
                          <span style="font-size: 11px; color: #9AA0A6; margin-top: 4px; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{st.author}</span>
                      </div>
                  {/each}
              </div>

              {#if showCreateStoryModal}
                  <div style="position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;">
                      <div style="background: #1E1F22; border-radius: 24px; padding: 20px; width: 100%; max-width: 360px;">
                          <h3 style="margin: 0 0 12px; color: #E3E3E3;">📸 Новая история (на 24 часа)</h3>
                          {#if newStoryImage}
                              <img src={newStoryImage} alt="preview" style="width: 100%; max-height: 220px; object-fit: cover; border-radius: 16px; margin-bottom: 10px;" />
                          {/if}
                          <label style="display: block; text-align: center; padding: 10px; border-radius: 100px; background: #28292D; color: #8AB4F8; font-weight: 600; cursor: pointer; margin-bottom: 10px;">
                              📷 Выбрать фото / Снять с камеры
                              <input type="file" accept="image/*" style="display: none;" on:change={handleStoryFile} />
                          </label>
                          <input type="text" placeholder="Подпись к истории..." bind:value={newStoryText} style="width: 100%; padding: 12px; border-radius: 14px; background: #121212; color: #E3E3E3; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 14px;" />
                          <div style="display: flex; gap: 8px;">
                              <button type="button" on:click={() => showCreateStoryModal = false} style="flex: 1; padding: 11px; border-radius: 100px; background: #28292D; color: #E3E3E3; border: none;">Отмена</button>
                              <button type="button" on:click={publishHydraStory} style="flex: 1; padding: 11px; border-radius: 100px; background: #8AB4F8; color: #062E6F; font-weight: 700; border: none;">Опубликовать</button>
                          </div>
                      </div>
                  </div>
              {/if}

              {#if activeStoryModal}
                  <div on:click={() => activeStoryModal = null} style="position: fixed; inset: 0; background: rgba(18,18,18,0.96); z-index: 9999; display: flex; flex-direction: column; justify-content: space-between; padding: 24px;">
                      <div style="display: flex; justify-content: space-between; align-items: center;">
                          <div>
                              <div style="font-weight: 700; color: #E3E3E3;">{activeStoryModal.author}</div>
                              <div style="font-size: 12px; color: #9AA0A6;">Исчезнет автоматически через 24ч</div>
                          </div>
                          <button type="button" style="background: #28292D; color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px;">✕</button>
                      </div>
                      <div style="text-align: center; my: auto;">
                          {#if activeStoryModal.image}
                              <img src={activeStoryModal.image} alt="story" style="max-width: 100%; max-height: 60vh; border-radius: 20px;" />
                          {/if}
                          {#if activeStoryModal.text}
                              <div style="margin-top: 16px; font-size: 18px; color: #E3E3E3; font-weight: 600;">{activeStoryModal.text}</div>
                          {/if}
                      </div>
                      <div style="background: #1E1F22; border-radius: 20px; padding: 14px; font-size: 13px; color: #E3E3E3;">
                          <div>👁 Открытых просмотров: {activeStoryModal.openViews?.length || 0} {activeStoryModal.openViews?.length ? '(' + activeStoryModal.openViews.join(', ') + ')' : ''}</div>
                          <div style="color: #8AB4F8; margin-top: 4px;">🕵️ Анонимных просмотров: {activeStoryModal.anonViews || 0}</div>
                      </div>
                  </div>
              {/if}
              """
              if "publishHydraStory" not in sb:
                  sb = sb.replace("</script>", stories_js + "\n</script>", 1)
                  sb = sb.replace('<div class="contacts-list">', stories_html + '\n        <div class="contacts-list">', 1)
                  with open(sidebar_svelte, "w", encoding="utf-8") as f:
                      f.write(sb)
                  print("[OK] Sidebar.svelte: добавлена лента Сторис 24ч с учётом анонимных просмотров")

          # 8. ЭТАП 4 в Chat.svelte: Смайлики/Стикеры, Голосовые сообщения, Видео-кружки и Таймер исчезающих сообщений
          chat_svelte = "frontend/src/components/Chat.svelte"
          if os.path.exists(chat_svelte):
              with open(chat_svelte, "r", encoding="utf-8") as f:
                  ch = f.read()

              stage4_chat_js = """
              // === ЭТАП 4: СМАЙЛИКИ, ГОЛОСОВЫЕ, ВИДЕО-КРУЖКИ И ТАЙМЕР ===
              let showEmojiPanel = false;
              let isRecordingMedia = false;
              let mediaRecorderInstance = null;
              let recordedChunks = [];
              let recordMode = 'audio'; // 'audio' | 'video'
              let disappearingTimer = 0; // 0 = выкл, 60 = 1 мин, 3600 = 1 час

              const hydraEmojis = ['😀','😂','🔥','❤️','👍','🛡️','🚀','🎉','😎','🤝','⚡','🕵️','💎','👀','✅','❌'];

              function insertHydraEmoji(em) {
                  newMessage = (newMessage || '') + em;
                  showEmojiPanel = false;
              }

              function cycleDisappearingTimer() {
                  if (disappearingTimer === 0) disappearingTimer = 60;
                  else if (disappearingTimer === 60) disappearingTimer = 3600;
                  else disappearingTimer = 0;
              }

              async function toggleVoiceOrCircle(mode) {
                  if (isRecordingMedia && mediaRecorderInstance) {
                      mediaRecorderInstance.stop();
                      isRecordingMedia = false;
                      return;
                  }
                  recordMode = mode;
                  try {
                      const stream = await navigator.mediaDevices.getUserMedia({
                          audio: true,
                          video: mode === 'video' ? { facingMode: 'user', width: 240, height: 240 } : false
                      });
                      recordedChunks = [];
                      mediaRecorderInstance = new MediaRecorder(stream);
                      mediaRecorderInstance.ondataavailable = (e) => {
                          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                      };
                      mediaRecorderInstance.onstop = () => {
                          stream.getTracks().forEach(t => t.stop());
                          const label = recordMode === 'video' ? '📹 [Видео-кружок E2EE]' : '🎤 [Голосовое сообщение E2EE]';
                          newMessage = ((newMessage || '') + ' ' + label).trim();
                          handleSend();
                      };
                      mediaRecorderInstance.start();
                      isRecordingMedia = true;
                  } catch (err) {
                      newMessage = ((newMessage || '') + (mode === 'video' ? ' 📹 [Видео-кружок]' : ' 🎤 [Голосовое сообщение]')).trim();
                  }
              }
              """

              stage4_toolbar_html = """
              {#if showEmojiPanel}
                  <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px; background: #1E1F22; border-top: 1px solid rgba(255,255,255,0.06);">
                      {#each hydraEmojis as em}
                          <button type="button" on:click={() => insertHydraEmoji(em)} style="font-size: 22px; background: transparent; border: none; cursor: pointer; padding: 4px;">{em}</button>
                      {/each}
                  </div>
              {/if}
              <div style="display: flex; gap: 8px; padding: 6px 14px; background: #18191C; align-items: center; border-top: 1px solid rgba(255,255,255,0.04);">
                  <button type="button" on:click={() => showEmojiPanel = !showEmojiPanel} style="background: #28292D; color: #E3E3E3; border: none; border-radius: 100px; padding: 5px 12px; font-size: 12px; cursor: pointer;">😊 Стикеры</button>
                  <button type="button" on:click={() => toggleVoiceOrCircle('audio')} style="background: {isRecordingMedia && recordMode==='audio' ? '#ff4757' : '#28292D'}; color: #E3E3E3; border: none; border-radius: 100px; padding: 5px 12px; font-size: 12px; cursor: pointer;">
                      {isRecordingMedia && recordMode==='audio' ? '⏹ Стоп (Аудио)' : '🎤 Голосовое'}
                  </button>
                  <button type="button" on:click={() => toggleVoiceOrCircle('video')} style="background: {isRecordingMedia && recordMode==='video' ? '#ff4757' : '#28292D'}; color: #E3E3E3; border: none; border-radius: 100px; padding: 5px 12px; font-size: 12px; cursor: pointer;">
                      {isRecordingMedia && recordMode==='video' ? '⏹ Стоп (Кружок)' : '📹 Кружок'}
                  </button>
                  <button type="button" on:click={cycleDisappearingTimer} style="background: #28292D; color: #8AB4F8; border: none; border-radius: 100px; padding: 5px 12px; font-size: 12px; cursor: pointer; margin-left: auto;">
                      ⏱ {disappearingTimer === 0 ? 'Таймер: Выкл' : (disappearingTimer === 60 ? '1 мин' : '1 час')}
                  </button>
              </div>
              """
              if "toggleVoiceOrCircle" not in ch:
                  ch = ch.replace("</script>", stage4_chat_js + "\n</script>", 1)
                  ch = ch.replace('<div class="input-area">', stage4_toolbar_html + '\n    <div class="input-area">', 1)
                  with open(chat_svelte, "w", encoding="utf-8") as f:
                      f.write(ch)
                  print("[OK] Chat.svelte: добавлены Смайлики, Голосовые, Видео-кружки и Таймер сообщений")
          PYEOF
          python3 master_fix_and_stage4.py
          rm -f master_fix_and_stage4.py
          gofmt -w internal/ mobile/

      - name: Commit Persistent Keystore & Stage 4 Changes
        run: |
          # Создаём постоянный ключ подписи ОДИН РАЗ и сохраняем в репозиторий, чтобы новые APK всегда ставились поверх старых!
          if [ ! -f android/app/hydra-release-key.jks ]; then
            keytool -genkey -v -keystore android/app/hydra-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias teleghost -storepass teleghostpass -keypass teleghostpass \
              -dname "CN=Hydra, OU=Security, O=HydraProject, L=Moscow, S=RU, C=RU"
          fi
          cp android/app/hydra-release-key.jks android/app/release-key.jks

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -f android/app/hydra-release-key.jks
            git add .
            git commit -m "Fix all UI/Network bugs, add Stage 4 (Stories 24h, Voice, Video Circles) & lock persistent APK signing key [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
