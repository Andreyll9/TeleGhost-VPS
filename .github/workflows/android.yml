name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix PublicKeyBase64 & Locate AddContact Across AppCore
        run: |
          cat << 'PYEOF' > fix_all_appcore.py
          import os, re

          # 1. Исправляем internal/appcore/appcore.go (строка 280 и ConnectToI2P)
          appcore_path = "internal/appcore/appcore.go"
          if os.path.exists(appcore_path):
              with open(appcore_path, "r", encoding="utf-8") as f:
                  ac = f.read()

              ac = ac.replace("a.Identity.Destination", "a.Identity.Keys.PublicKeyBase64")
              ac = ac.replace("a.Identity.Keys.Destination", "a.Identity.Keys.PublicKeyBase64")
              ac = ac.replace("a.Router.GetMyDestination()", "a.Identity.Keys.PublicKeyBase64")

              # Передаём приватный ключ Ed25519 для ECDH-шифрования при старте мессенджера в ConnectToI2P
              if "router.SetGlobalPrivateKey" not in ac:
                  ac = ac.replace(
                      "dest := a.Identity.Keys.PublicKeyBase64",
                      "dest := a.Identity.Keys.PublicKeyBase64\n\t\trouter.SetGlobalPrivateKey(a.Identity.Keys.SigningPrivateKey)"
                  )

              if "url." not in ac:
                  ac = ac.replace('\t"net/url"\n', '').replace('"net/url"\n', '')

              with open(appcore_path, "w", encoding="utf-8") as f:
                  f.write(ac)
              print("[OK] appcore.go: установлено точное поле a.Identity.Keys.PublicKeyBase64")

          # 2. Ищем файл в internal/appcore/, где объявлена функция AddContact, и внедряем __PING_SERVER__ и @никнеймы
          appcore_dir = "internal/appcore"
          if os.path.exists(appcore_dir):
              for fname in os.listdir(appcore_dir):
                  if not fname.endswith(".go"):
                      continue
                  fpath = os.path.join(appcore_dir, fname)
                  with open(fpath, "r", encoding="utf-8") as f:
                      code = f.read()

                  if "func (a *AppCore) AddContact(" in code and "__PING_SERVER__" not in code:
                      for pkg in ['"encoding/json"', '"fmt"', '"io"', '"net/http"', '"net/url"', '"strings"', '"time"']:
                          if pkg not in code:
                              code = code.replace("import (", "import (\n\t" + pkg, 1)

                      lines = code.splitlines()
                      new_lines = []
                      injected = False
                      for line in lines:
                          new_lines.append(line)
                          if not injected and "func (a *AppCore) AddContact(" in line and line.strip().endswith("{"):
                              params_str = line.split("AddContact(")[1].split(")")[0]
                              params = [p.strip() for p in params_str.split(",") if p.strip()]
                              dest_var = params[0].split()[0]
                              if dest_var == "ctx" and len(params) > 1:
                                  dest_var = params[1].split()[0]

                              ret_part = line.split(")")[-1]
                              returns_only_err = "error" in ret_part and "," not in ret_part
                              err_ret_ prefix = "return " if returns_only_err else "return nil, "

                              new_lines.append(f"""
          	{dest_var} = strings.TrimSpace({dest_var})
          	if {dest_var} == "__PING_SERVER__" {{
          		start := time.Now()
          		myPub := ""
          		if a.Identity != nil && a.Identity.Keys != nil {{
          			myPub = a.Identity.Keys.PublicKeyBase64
          		}}
          		client := &http.Client{{Timeout: 5 * time.Second}}
          		resp, err := client.Get("http://191.223.137.164:8085/health?pub=" + url.QueryEscape(myPub))
          		if err != nil {{
          			{err_ret_prefix}fmt.Errorf("❌ Сервер недоступен: %v", err)
          		}}
          		defer resp.Body.Close()
          		body, _ := io.ReadAll(resp.Body)
          		var h map[string]interface{{}}
          		_ = json.Unmarshal(body, &h)
          		rtt := time.Since(start).Milliseconds()
          		if wsOk, _ := h["ws_connected"].(bool); wsOk {{
          			{err_ret_prefix}fmt.Errorf("✅ Канал E2EE активен! Отклик Relay: %d мс (узлов онлайн: %v)", rtt, h["online_peers"])
          		}}
          		{err_ret_prefix}fmt.Errorf("✅ Сервер на связи (%d мс, онлайн: %v)", rtt, h["online_peers"])
          	}}
          	if len({dest_var}) < 40 {{
          		nick := strings.TrimPrefix({dest_var}, "@")
          		client := &http.Client{{Timeout: 5 * time.Second}}
          		resp, err := client.Get("http://191.223.137.164:8085/nick/resolve?nick=" + url.QueryEscape(nick))
          		if err == nil {{
          			defer resp.Body.Close()
          			if resp.StatusCode == http.StatusOK {{
          				body, _ := io.ReadAll(resp.Body)
          				var res map[string]string
          				if json.Unmarshal(body, &res) == nil && res["pub_key"] != "" {{
          					{dest_var} = res["pub_key"]
          				}}
          			}} else {{
          				{err_ret_prefix}fmt.Errorf("пользователь @%s не найден на сервере", nick)
          			}}
          		}}
          	}}""")
                              injected = True
                      code = "\n".join(new_lines)
                      with open(fpath, "w", encoding="utf-8") as f:
                          f.write(code)
                      print("[OK] Внедрены __PING_SERVER__ и поиск по @нику в файл:", fpath)

          # 3. Проверяем router.go, чтобы метод GetDestination / GetMyDestination не конфликтовал
          router_path = "internal/network/router/router.go"
          if os.path.exists(router_path):
              with open(router_path, "r", encoding="utf-8") as f:
                  rc = f.read()
              if "GetMyDestination()" in rc and "func (r *" not in rc.split("GetMyDestination()")[0]:
                  rc = rc.replace("r.GetMyDestination()", "r.GetDestination()")
                  with open(router_path, "w", encoding="utf-8") as f:
                      f.write(rc)
          PYEOF
          python3 fix_all_appcore.py
          rm -f fix_all_appcore.py
          gofmt -w internal/ mobile/

      - name: Commit patched files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Use PublicKeyBase64 in appcore and inject AddContact resolver [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Generate Signing Key & Build Signed APK
        working-directory: ./android
        run: |
          rm -f app/release-key.jks
          keytool -genkey -v -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias teleghost -storepass teleghostpass -keypass teleghostpass \
            -dname "CN=TeleGhost, OU=Private, O=TeleGhost, L=City, S=State, C=US"
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
