name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch AppCore & Router Before Build
        run: |
          cat << 'PYEOF' > patch_before_build.py
          import os, re

          appcore_path = "internal/appcore/appcore.go"
          if os.path.exists(appcore_path):
              with open(appcore_path, "r", encoding="utf-8") as f:
                  ac = f.read()

              # 1. Заменяем несуществующие поля Destination на вызов a.Router.GetMyDestination()
              ac = ac.replace("a.Identity.Keys.Destination", "a.Router.GetMyDestination()")
              ac = ac.replace("a.Identity.Destination", "a.Router.GetMyDestination()")

              # 2. Передаём приватный ключ в роутер для ECDH X25519
              if "router.SetGlobalPrivateKey" not in ac:
                  ac = re.sub(
                      r"(a\.Router\.SetDestination\([^\n]+)",
                      r"\1\n\t\tif a.Identity != nil && a.Identity.Keys != nil {\n\t\t\trouter.SetGlobalPrivateKey(a.Identity.Keys.SigningPrivateKey)\n\t\t}",
                      ac
                  )

              # 3. Встраиваем реальную проверку канала (__PING_SERVER__) и поиск по @нику в любую сигнатуру AddContact
              if "__PING_SERVER__" not in ac:
                  lines = ac.splitlines()
                  new_lines = []
                  injected = False
                  for line in lines:
                      new_lines.append(line)
                      if not injected and "func (a *AppCore) AddContact(" in line and line.strip().endswith("{"):
                          # Находим имя первого строкового параметра после контекста (обычно dest или address)
                          params_str = line.split("AddContact(")[1].split(")")[0]
                          params = [p.strip() for p in params_str.split(",") if p.strip()]
                          dest_var = "dest"
                          for p in params:
                              pname = p.split()[0]
                              if pname != "ctx":
                                  dest_var = pname
                                  break
                          new_lines.append(f"""
          	{dest_var} = strings.TrimSpace({dest_var})
          	if {dest_var} == "__PING_SERVER__" {{
          		start := time.Now()
          		myPub := ""
          		if a.Router != nil {{
          			myPub = a.Router.GetMyDestination()
          		}}
          		client := &http.Client{{Timeout: 5 * time.Second}}
          		resp, err := client.Get("http://191.223.137.164:8085/health?pub=" + url.QueryEscape(myPub))
          		if err != nil {{
          			return nil, fmt.Errorf("❌ Сервер недоступен: %v", err)
          		}}
          		defer resp.Body.Close()
          		body, _ := io.ReadAll(resp.Body)
          		var h map[string]interface{{}}
          		_ = json.Unmarshal(body, &h)
          		rtt := time.Since(start).Milliseconds()
          		if wsOk, _ := h["ws_connected"].(bool); wsOk && a.Router != nil && a.Router.IsReady() {{
          			_ = a.Router.SendPacket(myPub, []byte("HYDRA-LOOPBACK-TEST"))
          			return nil, fmt.Errorf("✅ Канал E2EE активен! Пакет прошёл через Relay за %d мс (узлов онлайн: %v)", rtt, h["online_peers"])
          		}}
          		return nil, fmt.Errorf("⚠️ Сервер отвечает (%d мс), но WebSocket-сессия переподключается", rtt)
          	}}
          	if len({dest_var}) < 40 {{
          		nick := strings.TrimPrefix({dest_var}, "@")
          		client := &http.Client{{Timeout: 5 * time.Second}}
          		resp, err := client.Get("http://191.223.137.164:8085/nick/resolve?nick=" + url.QueryEscape(nick))
          		if err == nil {{
          			defer resp.Body.Close()
          			if resp.StatusCode == http.StatusOK {{
          				body, _ := io.ReadAll(resp.Body)
          				var res map[string]string
          				if json.Unmarshal(body, &res) == nil && res["pub_key"] != "" {{
          					{dest_var} = res["pub_key"]
          				}}
          			}} else {{
          				return nil, fmt.Errorf("пользователь @%s не найден на сервере", nick)
          			}}
          		}}
          	}}""")
                          injected = True
                  ac = "\n".join(new_lines)

              # 4. Если пакет url не используется в коде — удаляем его из import, чтобы Go не выдавал ошибку
              if "url.QueryEscape" not in ac:
                  ac = ac.replace('\t"net/url"\n', '').replace('"net/url"\n', '').replace('"net/url"', '')

              with open(appcore_path, "w", encoding="utf-8") as f:
                  f.write(ac)
              print("[OK] appcore.go готов к сборке")
          PYEOF
          python3 patch_before_build.py
          rm -f patch_before_build.py
          gofmt -w internal/ mobile/

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Generate Signing Key & Build Signed APK
        working-directory: ./android
        run: |
          rm -f app/release-key.jks
          keytool -genkey -v -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias teleghost -storepass teleghostpass -keypass teleghostpass \
            -dname "CN=TeleGhost, OU=Private, O=TeleGhost, L=City, S=State, C=US"
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
