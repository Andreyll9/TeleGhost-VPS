      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Hardware Biometrics & FileChooser Fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Add real Android BiometricPrompt scanner, WebView onShowFileChooser & clean Auth/Settings [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
