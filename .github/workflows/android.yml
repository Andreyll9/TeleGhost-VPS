
name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Router Crypto Imports & Format
        run: |
          cat << 'PYEOF' > fix_imports.py
          import os

          router_path = "internal/network/router/router.go"
          if os.path.exists(router_path):
              with open(router_path, "r", encoding="utf-8") as f:
                  r_code = f.read()

              needed_imports = [
                  '"crypto/cipher"',
                  '"crypto/ed25519"',
                  '"crypto/rand"',
                  '"crypto/sha256"',
                  '"crypto/sha512"',
                  '"encoding/base64"',
                  '"fmt"',
                  '"math/big"',
                  '"golang.org/x/crypto/chacha20poly1305"',
                  '"golang.org/x/crypto/curve25519"',
              ]

              missing = [imp for imp in needed_imports if imp not in r_code]
              if missing and "import (" in r_code:
                  inject = "import (\n\t" + "\n\t".join(missing) + "\n"
                  r_code = r_code.replace("import (", inject, 1)
                  with open(router_path, "w", encoding="utf-8") as f:
                      f.write(r_code)
                  print("[OK] Добавлены крипто-импорты в router.go:", missing)
          PYEOF
          python3 fix_imports.py
          rm -f fix_imports.py
          gofmt -w internal/ mobile/

      - name: Commit fixed imports back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Fix E2EE crypto imports in router.go [skip ci]"
            git push
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Generate Signing Key & Build Signed APK
        working-directory: ./android
        run: |
          rm -f app/release-key.jks
          keytool -genkey -v -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias teleghost -storepass teleghostpass -keypass teleghostpass \
            -dname "CN=TeleGhost, OU=Private, O=TeleGhost, L=City, S=State, C=US"
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
