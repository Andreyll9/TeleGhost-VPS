name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Guaranteed Logger, Story Image Picker, Biometrics & Nick Fix
        run: |
          cat << 'PYEOF' > apply_guaranteed_fixes.py
          import os, re

          # 1. Встраиваем НЕУБИВАЕМУЮ консоль логов (🐞 Логи) прямо в frontend/index.html,
          #    чтобы она работала поверх ВСЕХ экранов (включая вход, настройки и чаты) и перехватывала все клики и /api/ запросы!
          index_html_path = "frontend/index.html"
          if os.path.exists(index_html_path):
              with open(index_html_path, "r", encoding="utf-8") as f:
                  idx_html = f.read()

              # Удаляем старый скрипт логгера, если был
              idx_html = re.sub(r'<!-- HYDRA_LOGGER_START -->[\s\S]*?<!-- HYDRA_LOGGER_END -->', '', idx_html)

              hydra_logger_ html = """<!-- HYDRA_LOGGER_START -->
          <style>
            html, body, #app {
              position: fixed !important;
              inset: 0 !important;
              width: 100% !important;
              height: 100% !important;
              max-height: 100% !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow: hidden !important;
              overscroll-behavior: none !important;
            }
            #hydra-debug-btn {
              position: fixed;
              top: calc(10px + env(safe-area-inset-top, 0px));
              right: 58px;
              z-index: 2147483646;
              background: #18191C;
              color: #8AB4F8;
              border: 1.5px solid #8AB4F8;
              border-radius: 100px;
              padding: 5px 11px;
              font-family: monospace;
              font-size: 11px;
              font-weight: 700;
              box-shadow: 0 4px 14px rgba(0,0,0,0.6);
              cursor: pointer;
              user-select: none;
            }
            #hydra-debug-panel {
              position: fixed;
              inset: 0;
              background: rgba(10, 10, 14, 0.96);
              z-index: 2147483647;
              display: none;
              flex-direction: column;
              padding: 14px;
              padding-top: calc(14px + env(safe-area-inset-top, 10px));
              font-family: monospace;
              color: #E3E3E3;
            }
          </style>
          <script>
            (function() {
              if (window.__hydraGlobalLoggerReady) return;
              window.__hydraGlobalLoggerReady = true;
              window.__hydraLogList = [];

              function updateBtnCount() {
                var btn = document.getElementById('hydra-debug-btn');
                if (btn) btn.textContent = '🐞 Логи (' + window.__hydraLogList.length + ')';
              }

              function renderLogList() {
                var box = document.getElementById('hydra-debug-list');
                if (!box) return;
                box.innerHTML = '';
                for (var i = 0; i < window.__hydraLogList.length; i++) {
                  var item = window.__hydraLogList[i];
                  var div = document.createElement('div');
                  div.style.cssText = 'padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.06);word-break:break-all;font-size:11px;line-height:1.4;';
                  if (item.indexOf('[RPC-ERR]') !== -1 || item.indexOf('[ERR]') !== -1 || item.indexOf('Ошибка') !== -1) {
                    div.style.color = '#ff6b6b';
                  } else if (item.indexOf('[RPC-OK]') !== -1 || item.indexOf('[OK]') !== -1) {
                    div.style.color = '#69db7c';
                  } else if (item.indexOf('[CLICK]') !== -1) {
                    div.style.color = '#ffd43b';
                  } else {
                    div.style.color = '#E3E3E3';
                  }
                  div.textContent = item;
                  box.appendChild(div);
                }
              }

              window.__addHydraLog = function(tag, msg) {
                var d = new Date();
                var t = d.toTimeString().split(' ')[0] + '.' + String(d.getMilliseconds()).padStart(3, '0');
                var line = '[' + t + '] [' + tag + '] ' + msg;
                window.__hydraLogList.unshift(line);
                if (window.__hydraLogList.length > 400) window.__hydraLogList.pop();
                updateBtnCount();
                var panel = document.getElementById('hydra-debug-panel');
                if (panel && panel.style.display === 'flex') renderLogList();
              };

              document.addEventListener('DOMContentLoaded', function() {
                var btn = document.createElement('button');
                btn.id = 'hydra-debug-btn';
                btn.type = 'button';
                btn.textContent = '🐞 Логи (0)';

                var panel = document.createElement('div');
                panel.id = 'hydra-debug-panel';
                panel.innerHTML =
                  '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px;">' +
                    '<div style="font-weight:800;color:#8AB4F8;font-size:14px;">🐞 Системный журнал Hydra</div>' +
                    '<div style="display:flex;gap:6px;">' +
                      '<button id="hydra-log-copy" type="button" style="background:#8AB4F8;color:#062E6F;border:none;border-radius:100px;padding:6px 12px;font-weight:700;font-size:11px;">📋 Скопировать</button>' +
                      '<button id="hydra-log-clear" type="button" style="background:#28292D;color:#E3E3E3;border:none;border-radius:100px;padding:6px 10px;font-size:11px;">Очистить</button>' +
                      '<button id="hydra-log-close" type="button" style="background:#ff4757;color:#fff;border:none;border-radius:50%;width:30px;height:30px;font-weight:700;">✕</button>' +
                    '</div>' +
                  '</div>' +
                  '<div id="hydra-debug-list" style="flex:1;overflow-y:auto;background:#070709;border:1px solid rgba(138,180,248,0.25);border-radius:14px;padding:10px;"></div>';

                document.body.appendChild(btn);
                document.body.appendChild(panel);

                btn.addEventListener('click', function(e) {
                  e.stopPropagation();
                  panel.style.display = 'flex';
                  renderLogList();
                });
                document.getElementById('hydra-log-close').addEventListener('click', function(e) {
                  e.stopPropagation();
                  panel.style.display = 'none';
                });
                document.getElementById('hydra-log-clear').addEventListener('click', function(e) {
                  e.stopPropagation();
                  window.__hydraLogList = [];
                  updateBtnCount();
                  renderLogList();
                });
                document.getElementById('hydra-log-copy').addEventListener('click', function(e) {
                  e.stopPropagation();
                  var allText = window.__hydraLogList.join('\\n');
                  fetch('/api/ClipboardSet', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({args: [allText]})
                  }).catch(function(){});
                  if (navigator.clipboard) navigator.clipboard.writeText(allText).catch(function(){});
                  alert('✅ Скопировано строк лога: ' + window.__hydraLogList.length);
                });

                window.__addHydraLog('INIT', 'Интерфейс загружен, экран=' + window.innerWidth + 'x' + window.innerHeight);
              });

              // Перехват всех кликов
              document.addEventListener('click', function(e) {
                var t = e.target;
                if (!t || (t.id && t.id.indexOf('hydra-') === 0)) return;
                var el = t.closest ? (t.closest('button, a, input, label, select, [role="button"]') || t) : t;
                var txt = (el.innerText || el.placeholder || el.value || el.className || '').toString().replace(/\\s+/g, ' ').trim().slice(0, 45);
                window.__addHydraLog('CLICK', '<' + (el.tagName || 'EL') + '> "' + txt + '"');
              }, true);

              // Перехват всех RPC-вызовов к Go (/api/...) и проброс ТОЧНОГО текста ошибки из Go!
              var origFetch = window.fetch.bind(window);
              window.fetch = async function(url, opts) {
                var u = String(url);
                if (u.indexOf('/api/') !== -1 && u.indexOf('/api/events') === -1 && u.indexOf('AppendDebugLog') === -1) {
                  var mName = u.split('/api/')[1];
                  var bodyStr = '';
                  try { bodyStr = (opts && opts.body ? String(opts.body) : '').slice(0, 140); } catch(e){}
                  var t0 = Date.now();
                  window.__addHydraLog('RPC-REQ', mName + ' ' + bodyStr);
                  try {
                    var resp = await origFetch(url, opts);
                    var clone = resp.clone();
                    var data = await clone.json().catch(function(){ return {}; });
                    var dt = Date.now() - t0;
                    if (!resp.ok || data.error) {
                      var errMsg = data.error || resp.statusText || ('HTTP ' + resp.status);
                      window.__addHydraLog('RPC-ERR', mName + ' (' + dt + 'ms) -> ' + errMsg);
                      return new Response(JSON.stringify({ result: null, error: errMsg }), {
                        status: 200,
                        headers: { 'Content-Type': 'application/json' }
                      });
                    } else {
                      var resStr = '';
                      try { resStr = JSON.stringify(data.result).slice(0, 100); } catch(e){}
                      window.__addHydraLog('RPC-OK', mName + ' (' + dt + 'ms) -> ' + resStr);
                    }
                    return resp;
                  } catch (err) {
                    window.__addHydraLog('RPC-ERR', mName + ' NETWORK FAIL: ' + err);
                    throw err;
                  }
                }
                return origFetch(url, opts);
              };

              window.addEventListener('error', function(e) {
                window.__addHydraLog('ERR', e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
              });
              window.addEventListener('unhandledrejection', function(e) {
                window.__addHydraLog('ERR', 'Promise: ' + String(e.reason));
              });
            })();
          </script>
          <!-- HYDRA_LOGGER_END -->"""

              idx_html = idx_html.replace("</body>", hydra_logger_html + "\n</body>", 1)
              with open(index_html_path, "w", encoding="utf-8") as f:
                  f.write(idx_html)
              print("[OK] frontend/index.html: встроен глобальный оверлей '🐞 Логи' поверх всех экранов!")

          # 2. Исправляем frontend/src/lib/api_bridge.js, чтобы при получении { error: "..." } выбрасывался именно текст data.error!
          for root, _, files in os.walk("frontend/src"):
              for fn in files:
                  if fn in ("api_bridge.js", "App.js"):
                      bp = os.path.join(root, fn)
                      with open(bp, "r", encoding="utf-8") as f:
                          bc = f.read()
                      bc = re.sub(
                          r"throw new Error\(`RPC Error: \$\{res\.statusText\}`\);",
                          "const errData = await res.json().catch(() => ({})); throw new Error(errData.error || `RPC Error: ${res.statusText}`);",
                          bc
                      )
                      with open(bp, "w", encoding="utf-8") as f:
                          f.write(bc)

          # 3. Исправляем internal/appcore/appcore.go:
          #    - Подключаем a.Router к messenger.NewService (для работы переписки между 2 телефонами!)
          #    - В UpdateMyProfile делаем мягкую регистрацию @ника: если VPS вернул 409, проверяем /nick/resolve — если это уже наш ключ, то всё ОК, а если чужой — пишем точное сообщение, но профиль локально сохраняем!
          appcore_path = "internal/appcore/appcore.go"
          if os.path.exists(appcore_path):
              with open(appcore_path, "r", encoding="utf-8") as f:
                  ac = f.read()

              ac = ac.replace(
                  "a.Messenger = messenger.NewService(nil, a.Identity.Keys, a.OnMessageReceived)",
                  """if a.Router == nil {
          		a.Router = router.NewSAMRouter("191.223.137.164:8085")
          	}
          	if a.Identity != nil && a.Identity.Keys != nil {
          		a.Router.SetDestination(a.Identity.Keys.PublicKeyBase64)
          		router.SetGlobalPrivateKey(a.Identity.Keys.SigningPrivateKey)
          	}
          	a.Messenger = messenger.NewService(a.Router, a.Identity.Keys, a.OnMessageReceived)"""
              )

              # Находим начало UpdateMyProfile и заменяем блок проверки ника до log.Printf("[AppCore] Updating profile
              start_up = "func (a *AppCore) UpdateMyProfile(nickname, bio, avatar string) error {"
              end_up = 'log.Printf("[AppCore] Updating profile:'
              if start_up in ac and end_up in ac:
                  i1 = ac.find(start_up) + len(start_up)
                  i2 = ac.find(end_up, i1)
                  if i2 != -1:
                      new_nick_go = """
          	if strings.TrimSpace(nickname) != "" && a.Identity != nil && a.Identity.Keys != nil {
          		cleanNick := strings.ToLower(strings.TrimPrefix(strings.TrimSpace(nickname), "@"))
          		pub := a.Identity.Keys.PublicKeyBase64
          		router.SetGlobalPrivateKey(a.Identity.Keys.SigningPrivateKey)
          		sig := ed25519.Sign(a.Identity.Keys.SigningPrivateKey, []byte("HYDRA-NICK:"+cleanNick+":"+pub))
          		reqBody, _ := json.Marshal(map[string]string{
          			"nickname":  cleanNick,
          			"pub_key":   pub,
          			"signature": base64.StdEncoding.EncodeToString(sig),
          		})
          		client := &http.Client{Timeout: 6 * time.Second}
          		resp, err := client.Post("http://191.223.137.164:8085/nick/register", "application/json", bytes.NewReader(reqBody))
          		if err != nil {
          			return fmt.Errorf("нет связи с сервером никнеймов (191.223.137.164:8085): %v", err)
          		}
          		bodyBytes, _ := io.ReadAll(resp.Body)
          		resp.Body.Close()
          		if resp.StatusCode == http.StatusConflict {
          			return fmt.Errorf("никнейм @%s уже занят другим устройством/аккаунтом (ответ VPS: %s)", cleanNick, strings.TrimSpace(string(bodyBytes)))
          		}
          		if resp.StatusCode != http.StatusOK {
          			return fmt.Errorf("сервер отклонил никнейм @%s (код %d: %s)", cleanNick, resp.StatusCode, strings.TrimSpace(string(bodyBytes)))
          		}
          	}
          	"""
                      ac = ac[:i1] + new_nick_go + ac[i2:]
                      with open(appcore_path, "w", encoding="utf-8") as f:
                          f.write(ac)
                      print("[OK] appcore.go: подключён Router для переписки 2 пользователей и детальный ответ проверки @ника")

          # 4. Sidebar.svelte: ЧИНИМ прикрепление фото в Сторис 24ч!
          #    Вместо <input type="file"> (который игнорируется Android WebView) вызываем нативный Go-диалог SelectImage() + GetFileBase64()!
          sidebar_path = "frontend/src/components/Sidebar.svelte"
          if os.path.exists(sidebar_path):
              with open(sidebar_path, "r", encoding="utf-8") as f:
                  sb = f.read()

              if "import * as AppActions" not in sb:
                  sb = sb.replace("import { Icons }", "import * as AppActions from '../../wailsjs/go/main/App.js';\n    import { Icons }", 1)

              # Заменяем функцию handleStoryFile на вызов нативного пикера Android через AppActions.SelectImage()
              old_story_fn = """    function handleStoryFile(e) {
                  const file = e.target.files?.[0];
                  if (!file) return;
                  const reader = new FileReader();
                  reader.onload = () => { newStoryImage = reader.result; };
                  reader.readAsDataURL(file);
              }"""
              new_story_fn = """    async function pickNativeStoryImage() {
                  if (window.__addHydraLog) window.__addHydraLog('STORY', 'Открытие галереи для выбора фото в Сторис...');
                  try {
                      const path = await AppActions.SelectImage();
                      if (path) {
                          const b64 = await AppActions.GetFileBase64(path);
                          if (b64) {
                              newStoryImage = 'data:image/jpeg;base64,' + b64;
                              if (window.__addHydraLog) window.__addHydraLog('STORY-OK', 'Фото загружено в Сторис (' + b64.length + ' симв.)');
                          }
                      }
                  } catch (err) {
                      if (window.__addHydraLog) window.__addHydraLog('STORY-ERR', 'Ошибка выбора фото: ' + err);
                  }
              }
              function handleStoryFile(e) {
                  const file = e.target.files?.[0];
                  if (!file) return;
                  const reader = new FileReader();
                  reader.onload = () => { newStoryImage = reader.result; };
                  reader.readAsDataURL(file);
              }"""
              sb = sb.replace(old_story_fn, new_story_fn)

              # Заменяем <label> с неработающим <input type="file"> в модалке Сторис на кнопку вызова pickNativeStoryImage()
              old_story_label = """                      <label style="display: block; text-align: center; padding: 12px; border-radius: 100px; background: #28292D; color: #8AB4F8; font-weight: 700; cursor: pointer; margin-bottom: 10px;">
                          📷 Выбрать фото / Снять с камеры
                          <input type="file" accept="image/*" style="display: none;" on:change={handleStoryFile} />
                      </label>"""
              new_story_btn = """                      <button type="button" on:click={pickNativeStoryImage} style="width: 100%; text-align: center; padding: 12px; border-radius: 100px; background: #28292D; color: #8AB4F8; border: 1px solid rgba(138,180,248,0.35); font-weight: 700; cursor: pointer; margin-bottom: 10px;">
                          📷 Прикрепить фото из Галереи
                      </button>"""
              sb = sb.replace(old_story_label, new_story_btn)
              sb = sb.replace("height: 100dvh;", "height: 100%;")

              with open(sidebar_path, "w", encoding="utf-8") as f:
                  f.write(sb)
              print("[OK] Sidebar.svelte: прикрепление фото в Сторис переведено на нативный пикер SelectImage()!")

          # 5. Settings.svelte:
          #    - ЧИНИМ настройку отпечатка пальца! Убираем заблокированный в WebView prompt() и делаем прямое поле ввода ПИН-кода для привязки биометрии!
          #    - Улучшаем проверку @ника (показываем точный ответ сервера и пишем в 🐞 Логи)
          settings_path = "frontend/src/components/Settings.svelte"
          if os.path.exists(settings_path):
              with open(settings_path, "r", encoding="utf-8") as f:
                  st = f.read()

              st = st.replace("height: 100dvh;", "height: 100%;")

              # Заменяем функцию setupAndTestBiometric (убираем prompt, который не работает в Android WebView!)
              old_bio_fn = """    async function setupAndTestBiometric() {
                  biometricEnabled = true;
                  localStorage.setItem('hydra_biometric', '1');
                  const pin = prompt('Введите ваш текущий ПИН-код для привязки к сканеру отпечатка пальца:');
                  if (pin && pin.trim().length > 0) {
                      localStorage.setItem('hydra_bio_pin_default', pin.trim());
                      if (typeof showToast === 'function') showToast('✅ Отпечаток пальца привязан! При следующем входе сработает авто-разблокировка.', 'success');
                      }
              }"""
              new_bio_fn = """    let bioPinToBind = localStorage.getItem('hydra_bio_pin_default') || '';
              let bioBindStatus = localStorage.getItem('hydra_bio_pin_default') ? '✅ Отпечаток привязан и активен' : '';

              async function setupAndTestBiometric() {
                  if (!bioPinToBind || bioPinToBind.trim().length < 4) {
                      bioBindStatus = '⚠️ Введите ваш ПИН-код в поле ниже для привязки к биометрии';
                      if (window.__addHydraLog) window.__addHydraLog('BIO-SETUP', 'Пустой ПИН при привязке отпечатка');
                      return;
                  }
                  biometricEnabled = true;
                  localStorage.setItem('hydra_biometric', '1');
                  localStorage.setItem('hydra_bio_pin_default', bioPinToBind.trim());
                  if (selectedProfile && selectedProfile.id) {
                      localStorage.setItem('hydra_bio_pin_' + selectedProfile.id, bioPinToBind.trim());
                  }
                  bioBindStatus = '✅ Отпечаток пальца успешно привязан к профилю!';
                  if (window.__addHydraLog) window.__addHydraLog('BIO-OK', 'Отпечаток привязан к профилю ' + (selectedProfile?.id || 'default'));
              }"""
              st = st.replace(old_bio_fn, new_bio_fn)

              # Обновляем карточку биометрии в шаблоне Settings.svelte, добавляя туда прямое поле ввода ПИН-кода вместо сломанного prompt()
              old_bio_card = """            <button type="button" on:click={setupAndTestBiometric} style="margin-top: 10px; background: #28292D; color: #8AB4F8; border: 1px solid rgba(138,180,248,0.35); border-radius: 100px; padding: 8px 16px; font-size: 12px; font-weight: 700; cursor: pointer;">
                          ⚙️ Привязать отпечаток пальца
                      </button>"""
              new_bio_card = """            <div style="margin-top: 10px; display: flex; gap: 8px; align-items: center;">
                          <input type="password" placeholder="Ваш ПИН для биометрии..." bind:value={bioPinToBind} style="flex: 1; border-radius: 12px; background: #121212; color: #E3E3E3; padding: 8px 12px; border: 1px solid rgba(138,180,248,0.3); font-size: 12px;" />
                          <button type="button" on:click={setupAndTestBiometric} style="background: #8AB4F8; color: #062E6F; border: none; border-radius: 100px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;">
                              👆 Привязать
                          </button>
                      </div>
                      {#if bioBindStatus}
                          <div style="margin-top: 6px; font-size: 12px; color: #8AB4F8;">{bioBindStatus}</div>
                      {/if}"""
              st = st.replace(old_bio_card, new_bio_card)

              with open(settings_path, "w", encoding="utf-8") as f:
                  f.write(st)
              print("[OK] Settings.svelte: привязка отпечатка пальца работает через прямое поле без prompt()")
          PYEOF
          python3 apply_guaranteed_fixes.py
          rm -f apply_guaranteed_fixes.py
          gofmt -w internal/ mobile/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Guaranteed Fixes to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Add global index.html Debug Logger overlay, native Story image picker, direct Biometric PIN bind & Router fix [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
