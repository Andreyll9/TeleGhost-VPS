              i2 = st.find(m2, i1) if i1 != -1 else -1
              if i1 != -1 and i2 != -1:
                  new_settings_bio = """let bioPinToBind = '';
              let bioBindStatus = localStorage.getItem('hydra_hw_bio_bound') === '1'
