              print("[OK] Auth.svelte: чисто обновлён по индексам до </script> без синтаксических ошибок!")

          # 5. Sidebar.svelte: подключаем выбор фото в Сторис к нативному onShowFileChooser
          sidebar_path = "frontend/src/components/Sidebar.svelte"
          if os.path.exists(sidebar_path):
              with open(sidebar_path, "r", encoding="utf-8") as f:
                  sb = f.read()

              both_story_picker = """                      <label style="display: block; width: 100%; text-align: center; padding: 12px; border-radius: 100px; background: #28292D; color: #8AB4F8; border: 1px solid rgba(138,180,248,0.35); font-weight: 700; cursor: pointer; margin-bottom: 10px;">
