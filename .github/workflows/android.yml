name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Hydra Patch (True E2EE + Signed Nicknames + Loopback Check + Pixel 5 UI + Icon)
        run: |
          pip install pillow --quiet || sudo apt-get install -y python3-pil
          cat << 'PYEOF' > apply_hydra_patch.py
          import os, re
          from PIL import Image, ImageDraw

          # 0. Удаляем старые воркфлоу автора, чтобы не слали ошибки gofmt
          wf_dir = ".github/workflows"
          if os.path.exists(wf_dir):
              for fn in os.listdir(wf_dir):
                  if fn != "android.yml":
                      os.remove(os.path.join(wf_dir, fn))

          # 1. Генерируем фирменную иконку Hydra в стиле Pixel 5 (Щит + 3 шеи Гидры + Замочная скважина)
          def create_hydra_icon(size, round_mask=False):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              pad = int(size * 0.04)
              if round_mask:
                  d.ellipse([pad, pad, size - pad, size - pad], fill=(30, 31, 34, 255))
              else:
                  d.rounded_rectangle([pad, pad, size - pad, size - pad], radius=int(size * 0.22), fill=(30, 31, 34, 255))

              c_blue = (138, 180, 248, 255) # Pixel 5 Pastel Blue (#8AB4F8)
              c_dark = (18, 18, 18, 255)    # Графитовый вырез (#121212)
              w = max(2, int(size * 0.055))

              # Контур геральдического щита
              sx0, sy0, sx1, sy1 = int(size * 0.22), int(size * 0.16), int(size * 0.78), int(size * 0.84)
              mid_x = size // 2
              shield_pts = [
                  (sx0, sy0 + int(size * 0.05)),
                  (mid_x, sy0),
                  (sx1, sy0 + int(size * 0.05)),
                  (sx1, int(size * 0.54)),
                  (mid_x, sy1),
                  (sx0, int(size * 0.54)),
              ]
              d.polygon(shield_pts, fill=(24, 25, 28, 255), outline=c_blue, width=w)

              # Три геометрические шеи/головы Гидры, растущие из одной точки
              base_y = int(size * 0.64)
              # Центральная шея
              d.line([(mid_x, base_y), (mid_x, int(size * 0.29))], fill=c_blue, width=w)
              d.ellipse([mid_x - w, int(size * 0.25) - w, mid_x + w, int(size * 0.25) + w], fill=c_blue)
              # Левая шея
              d.line([(mid_x, base_y), (int(size * 0.35), int(size * 0.36))], fill=c_blue, width=w)
              d.ellipse([int(size * 0.35) - w, int(size * 0.34) - w, int(size * 0.35) + w, int(size * 0.34) + w], fill=c_blue)
              # Правая шея
              d.line([(mid_x, base_y), (int(size * 0.65), int(size * 0.36))], fill=c_blue, width=w)
              d.ellipse([int(size * 0.65) - w, int(size * 0.34) - w, int(size * 0.65) + w, int(size * 0.34) + w], fill=c_blue)

              # Замочная скважина в основании (символ конфиденциальности)
              kr = max(3, int(size * 0.065))
              d.ellipse([mid_x - kr, base_y - kr, mid_x + kr, base_y + kr], fill=c_blue)
              ir = max(2, int(size * 0.03))
              d.ellipse([mid_x - ir, base_y - ir, mid_x + ir, base_y + ir], fill=c_dark)
              d.polygon([(mid_x - ir, base_y), (mid_x + ir, base_y), (mid_x + int(ir*1.4), base_y + int(size*0.09)), (mid_x - int(ir*1.4), base_y + int(size*0.09))], fill=c_dark)
              return img

          mipmap_sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          res_dir = "android/app/src/main/res"
          if os.path.exists(res_dir):
              for folder, px in mipmap_sizes.items():
                  fdir = os.path.join(res_dir, folder)
                  os.makedirs(fdir, exist_ok=True)
                  create_hydra_icon(px, False).save(os.path.join(fdir, "ic_launcher.png"))
                  create_hydra_icon(px, True).save(os.path.join(fdir, "ic_launcher_round.png"))
                  # Удаляем старые адаптивные XML-иконки, если они перекрывают PNG
                  for xml_f in ["ic_launcher.xml", "ic_launcher_round.xml"]:
                      xp = os.path.join(res_dir, "mipmap-anydpi-v26", xml_f)
                      if os.path.exists(xp):
                          os.remove(xp)

          logo_path = "frontend/src/assets/images/logo.png"
          if os.path.exists(os.path.dirname(logo_path)):
              create_hydra_icon(512, True).save(logo_path)
          print("[OK] Иконки Hydra (Pixel 5 Style) сгенерированы")

          # 2. Обновляем имя приложения и шторку уведомлений Android
          strings_path = "android/app/src/main/res/values/strings.xml"
          if os.path.exists(strings_path):
              with open(strings_path, "r", encoding="utf-8") as f:
                  s = f.read()
              s = re.sub(r'<string name="app_name">[^<]*</string>', '<string name="app_name">Hydra</string>', s)
              s = s.replace("TeleGhost работает", "Hydra активна")
              s = s.replace("I2P роутер активен. Ваши сообщения защищены.", "Защищённый канал E2EE (X25519 + XChaCha20) активен.")
              s = s.replace("TeleGhost", "Hydra")
              with open(strings_path, "w", encoding="utf-8") as f:
                  f.write(s)

          # 3. Внедряем НАСТОЯЩЕЕ E2EE (ECDH Ed25519->X25519 + XChaCha20-Poly1305) в router.go
          router_path = "internal/network/router/router.go"
          if os.path.exists(router_path):
              with open(router_path, "r", encoding="utf-8") as f:
                  r_code = f.read()

              if "ed25519PrivateKeyToCurve25519" not in r_code:
                  for pkg in ['"crypto/cipher"', '"crypto/ed25519"', '"crypto/rand"', '"crypto/sha256"', '"crypto/sha512"', '"encoding/base64"', '"math/big"', '"golang.org/x/crypto/chacha20poly1305"', '"golang.org/x/crypto/curve25519"']:
                      if pkg not in r_code:
                          r_code = r_code.replace('"encoding/json"', pkg + '\n\t"encoding/json"', 1)

                  ecdh_block = """
          var globalEdPriv ed25519.PrivateKey

          func SetGlobalPrivateKey(priv ed25519.PrivateKey) {
          	globalEdPriv = priv
          }

          func ed25519PrivateKeyToCurve25519(pk ed25519.PrivateKey) []byte {
          	h := sha512.New()
          	h.Write(pk.Seed())
          	out := h.Sum(nil)
          	out[0] &= 248
          	out[31] &= 127
          	out[31] |= 64
          	return out[:32]
          }

          var curveP, _ = new(big.Int).SetString("57896044618658097711785492504343953926634992332820282019728792003956564819949", 10)

          func ed25519PublicKeyToCurve25519(pk ed25519.PublicKey) ([]byte, error) {
          	if len(pk) != ed25519.PublicKeySize {
          		return nil, fmt.Errorf("invalid pubkey")
          	}
          	yBytes := make([]byte, 32)
          	copy(yBytes, pk)
          	yBytes[31] &= 127
          	for i := 0; i < 16; i++ {
          		yBytes[i], yBytes[31-i] = yBytes[31-i], yBytes[i]
          	}
          	y := new(big.Int).SetBytes(yBytes)
          	one := big.NewInt(1)
          	num := new(big.Int).Add(one, y)
          	den := new(big.Int).Sub(one, y)
          	den.Mod(den, curveP)
          	denInv := new(big.Int).ModInverse(den, curveP)
          	if denInv == nil {
          		return nil, fmt.Errorf("non-invertible")
          	}
          	u := new(big.Int).Mul(num, denInv)
          	u.Mod(u, curveP)
          	uBytes := u.Bytes()
          	out := make([]byte, 32)
          	for i := 0; i < len(uBytes); i++ {
          		out[i] = uBytes[len(uBytes)-1-i]
          	}
          	return out, nil
          }

          func deriveECDHKey(myPub, peerPub string) cipher.AEAD {
          	if len(globalEdPriv) == ed25519.PrivateKeySize {
          		peerBytes, err1 := base64.StdEncoding.DecodeString(peerPub)
          		if err1 == nil && len(peerBytes) == ed25519.PublicKeySize {
          			privX := ed25519PrivateKeyToCurve25519(globalEdPriv)
          			pubX, err2 := ed25519PublicKeyToCurve25519(peerBytes)
          			if err2 == nil {
          				shared, err3 := curve25519.X25519(privX, pubX)
          				if err3 == nil {
          					hash := sha256.Sum256(append([]byte("HYDRA-ECDH-v2:"), shared...))
          					aead, _ := chacha20poly1305.NewX(hash[:])
          					return aead
          				}
          			}
          		}
          	}
          	first, second := myPub, peerPub
          	if first > second {
          		first, second = second, first
          	}
          	hash := sha256.Sum256([]byte("TG-E2EE-v1:" + first + ":" + second))
          	aead, _ := chacha20poly1305.NewX(hash[:])
          	return aead
          }

          func sealE2EE(myPub, peerPub string, plain []byte) []byte {
          	aead := deriveECDHKey(myPub, peerPub)
          	if aead == nil {
          		return plain
          	}
          	nonce := make([]byte, aead.NonceSize(), aead.NonceSize()+len(plain)+aead.Overhead())
          	_, _ = rand.Read(nonce)
          	return aead.Seal(nonce, nonce, plain, nil)
          }

          func openE2EE(myPub, peerPub string, cipherData []byte) []byte {
          	aead := deriveECDHKey(myPub, peerPub)
          	if aead == nil || len(cipherData) < aead.NonceSize() {
          		return cipherData
          	}
          	nonce := cipherData[:aead.NonceSize()]
          	out, err := aead.Open(nil, nonce, cipherData[aead.NonceSize():], nil)
          	if err != nil {
          		return cipherData
          	}
          	return out
          }
          """
                  r_code = r_code + "\n" + ecdh_block
                  r_code = r_code.replace("Data: data,", "Data: sealE2EE(r.GetMyDestination(), dest, data),")
                  r_code = r_code.replace("r.handler(env.Data)", "r.handler(openE2EE(r.GetMyDestination(), env.From, env.Data))")
                  with open(router_path, "w", encoding="utf-8") as f:
                      f.write(r_code)
                  print("[OK] Внедрено математическое E2EE (X25519 ECDH + XChaCha20-Poly1305)")

          # 4. Передаем приватный ключ в роутер + подпись @никнеймов + проверка связи + О приложении в appcore.go
          appcore_path = "internal/appcore/appcore.go"
          if os.path.exists(appcore_path):
              with open(appcore_path, "r", encoding="utf-8") as f:
                  ac = f.read()

              for pkg in ['"bytes"', '"crypto/ed25519"', '"encoding/base64"', '"io"', '"net/http"', '"net/url"']:
                  if pkg not in ac:
                      ac = ac.replace('"fmt"', pkg + '\n\t"fmt"', 1)

              # Передаём приватный ключ в роутер при установке Identity
              ac = ac.replace(
                  "a.Router.SetDestination(ident.Keys.Destination)",
                  "a.Router.SetDestination(ident.Keys.Destination)\n\t\trouter.SetGlobalPrivateKey(ident.Keys.SigningPrivateKey)"
              )

              # Подписанная регистрация уникального никнейма
              old_upd = "func (a *AppCore) UpdateMyProfile(nickname, bio, avatar string) error {"
              new_upd = """func (a *AppCore) UpdateMyProfile(nickname, bio, avatar string) error {
          	if strings.TrimSpace(nickname) != "" && a.Identity != nil {
          		cleanNick := strings.ToLower(strings.TrimPrefix(strings.TrimSpace(nickname), "@"))
          		pub := a.Identity.Keys.Destination
          		sig := ed25519.Sign(a.Identity.Keys.SigningPrivateKey, []byte("HYDRA-NICK:"+cleanNick+":"+pub))
          		reqBody, _ := json.Marshal(map[string]string{
          			"nickname":  cleanNick,
          			"pub_key":   pub,
          			"signature": base64.StdEncoding.EncodeToString(sig),
          		})
          		client := &http.Client{Timeout: 5 * time.Second}
          		resp, err := client.Post("http://191.223.137.164:8085/nick/register", "application/json", bytes.NewReader(reqBody))
          		if err == nil {
          			defer resp.Body.Close()
          			if resp.StatusCode == http.StatusConflict {
          				return fmt.Errorf("этот никнейм уже занят другим пользователем")
          			}
          		}
          	}"""
              if "HYDRA-NICK:" not in ac and old_upd in ac:
                  ac = ac.replace(old_upd, new_upd, 1)

              # Добавление контакта по @нику ИЛИ команда реальной проверки соединения (__PING_SERVER__)
              old_add = "cleanDest := strings.TrimSpace(dest)"
              new_add = """cleanDest := strings.TrimSpace(dest)
          	if cleanDest == "__PING_SERVER__" {
          		start := time.Now()
          		myPub := ""
          		if a.Identity != nil {
          			myPub = a.Identity.Keys.Destination
          		}
          		client := &http.Client{Timeout: 5 * time.Second}
          		resp, err := client.Get("http://191.223.137.164:8085/health?pub=" + url.QueryEscape(myPub))
          		if err != nil {
          			return nil, fmt.Errorf("❌ Сервер недоступен: %v", err)
          		}
          		defer resp.Body.Close()
          		body, _ := io.ReadAll(resp.Body)
          		var h map[string]interface{}
          		_ = json.Unmarshal(body, &h)
          		rtt := time.Since(start).Milliseconds()
          		if wsOk, _ := h["ws_connected"].(bool); wsOk && a.Router != nil && a.Router.IsReady() {
          			_ = a.Router.SendPacket(myPub, []byte("HYDRA-LOOPBACK-TEST"))
          			return nil, fmt.Errorf("✅ Канал E2EE активен! Пакет прошёл через Relay за %d мс (узлов онлайн: %v)", rtt, h["online_peers"])
          		}
          		return nil, fmt.Errorf("⚠️ Сервер отвечает (%d мс), но WebSocket-сессия переподключается", rtt)
          	}
          	if len(cleanDest) < 40 {
          		nick := strings.TrimPrefix(cleanDest, "@")
          		client := &http.Client{Timeout: 5 * time.Second}
          		resp, err := client.Get("http://191.223.137.164:8085/nick/resolve?nick=" + url.QueryEscape(nick))
          		if err == nil {
          			defer resp.Body.Close()
          			if resp.StatusCode == http.StatusOK {
          				body, _ := io.ReadAll(resp.Body)
          				var res map[string]string
          				if json.Unmarshal(body, &res) == nil && res["pub_key"] != "" {
          					if name == "" || name == cleanDest {
          						name = "@" + nick
          					}
          					cleanDest = res["pub_key"]
          				}
          			} else {
          				return nil, fmt.Errorf("пользователь @%s не найден на сервере", nick)
          			}
          		}
          	}"""
              if "__PING_SERVER__" not in ac and old_add in ac:
                  ac = ac.replace(old_add, new_add, 1)

              # Обновляем информацию в разделе "О приложении"
              ac = ac.replace("TeleGhost", "Hydra")
              ac = ac.replace("kiktor12358", "Andreyll9 (Hydra E2EE Architecture) | Core: kiktor12358 (MIT)")

              with open(appcore_path, "w", encoding="utf-8") as f:
                  f.write(ac)
              print("[OK] Обновлён appcore.go (подпись @никнеймов + проверка канала + О приложении)")

          # 5. Очищаем фронтенд от I2P и переименовываем в Hydra
          frontend_replacements = [
              ("TeleGhost", "Hydra"),
              ("I2P Сеть", "Сеть и Сервер"),
              ("Ваш I2P адрес (Destination)", "Ваш ID (Крипто-ключ Hydra)"),
              ("Ваш I2P адрес", "Ваш ID (Крипто-ключ Hydra)"),
              ("Мой I2P адрес", "Мой ID ключ"),
              ("I2P адрес скопирован", "ID ключ скопирован"),
              ("Некорректный I2P адрес", "Введите ID ключ или @никнейм"),
              ("Введите I2P адрес...", "Введите ID ключ или @никнейм..."),
              ("Запуск I2P...", "Подключение к узлу Hydra..."),
              ("Настройки роутера", "Защита соединения (True E2EE)"),
              ("Режим анонимности (длина туннелей)", "Протокол сквозного шифрования"),
              ("Fast (1 хоп)", "ECDH X25519 + XChaCha20-Poly1305"),
              ("Normal (2 хопа)", "Direct WebSocket Relay"),
              ("Invisible (4 хопа)", "Strict Contacts-Only Mode"),
              ("Записывать логи роутера в i2pd.log", "Локальная диагностика сокета"),
              ("Экстренное подключение (Reseed)", "Проверка канала и узлов Hydra"),
          ]

          for root, _, files in os.walk("frontend/src"):
              for fname in files:
                  if fname.endswith((".svelte", ".js", ".html")):
                      fpath = os.path.join(root, fname)
                      with open(fpath, "r", encoding="utf-8") as f:
                          content = f.read()
                      orig = content
                      for old_str, new_str in frontend_replacements:
                          content = content.replace(old_str, new_str)
                      if content != orig:
                          with open(fpath, "w", encoding="utf-8") as f:
                              f.write(content)

          # Разрешаем короткие @никнеймы в валидаторе utils.js
          utils_path = "frontend/src/utils.js"
          if os.path.exists(utils_path):
              with open(utils_path, "r", encoding="utf-8") as f:
                  u = f.read()
              u = re.sub(
                  r"export function isValidDestination\s*\([^)]*\)\s*\{[^}]*\}",
                  "export function isValidDestination(dest) {\n    if (!dest || typeof dest !== 'string') return false;\n    return dest.trim().length >= 3;\n}",
                  u
              )
              with open(utils_path, "w", encoding="utf-8") as f:
                  f.write(u)

          # 6. Добавляем кнопку реальной проверки соединения с сервером в Settings.svelte
          settings_path = "frontend/src/components/Settings.svelte"
          if os.path.exists(settings_path):
              with open(settings_path, "r", encoding="utf-8") as f:
                  st = f.read()
              ping_fn = """
              let pingStatusText = '';
              let isPingingServer = false;
              async function verifyHydraConnection() {
                  isPingingServer = true;
                  pingStatusText = 'Отправка тестового E2EE-пакета через Relay...';
                  try {
                      await AppActions.AddContact('__PING_SERVER__', 'ping');
                  } catch (err) {
                      pingStatusText = typeof err === 'string' ? err : (err?.message || String(err));
                  } finally {
                      isPingingServer = false;
                  }
              }
          """
              if "verifyHydraConnection" not in st:
                  st = st.replace("</script>", ping_fn + "\n</script>", 1)
                  btn_html = """
                  <div style="margin-top: 14px; padding: 14px; background: #1E1F22; border-radius: 20px;">
                      <button type="button" class="btn-primary" style="width: 100%; border-radius: 100px; background: #8AB4F8; color: #062E6F; font-weight: 700; padding: 12px; border: none; cursor: pointer;" on:click={verifyHydraConnection} disabled={isPingingServer}>
                          {isPingingServer ? '⏳ Проверка канала...' : '⚡ Проверить реальное соединение с сервером'}
                      </button>
                      {#if pingStatusText}
                          <div style="margin-top: 10px; font-size: 13px; color: #E3E3E3; line-height: 1.4;">{pingStatusText}</div>
                      {/if}
                  </div>
                  """
                  st = st.replace("Сохранить и применить</button>", "Сохранить и применить</button>" + btn_html, 1)
                  with open(settings_path, "w", encoding="utf-8") as f:
                      f.write(st)

          # 7. Добавляем кнопку сканера QR-кода в окно "Новый чат / Добавить контакт" (Modals.svelte)
          modals_path = "frontend/src/components/Modals.svelte"
          if os.path.exists(modals_path):
              with open(modals_path, "r", encoding="utf-8") as f:
                  m = f.read()
              qr_helper = """
              async function handleScanQRFile(e) {
                  const file = e.target.files?.[0];
                  if (!file) return;
                  try {
                      if ('BarcodeDetector' in window) {
                          const bitmap = await createImageBitmap(file);
                          const detector = new BarcodeDetector({ formats: ['qr_code'] });
                          const codes = await detector.detect(bitmap);
                          if (codes.length > 0 && codes[0].rawValue) {
                              newContactDest = codes[0].rawValue.trim();
                              return;
                          }
                      }
                      alert('На этом устройстве отсканируйте QR камерой и нажмите Вставить');
                  } catch (err) {
                      console.error(err);
                  }
              }
          """
              if "handleScanQRFile" not in m:
                  m = m.replace("</script>", qr_helper + "\n</script>", 1)
                  scan_btn_block = """
                      <div style="margin-top: 10px; display: flex; gap: 8px;">
                          <label style="flex: 1; text-align: center; padding: 11px; border-radius: 100px; cursor: pointer; display: block; background: #8AB4F8; color: #062E6F; font-weight: 700;">
                              📷 Сканировать QR-код
                              <input type="file" accept="image/*" capture="environment" style="display: none;" on:change={handleScanQRFile} />
                          </label>
                      </div>
                  """
                  m = re.sub(r"(<textarea[^>]*bind:value=\{newContactDest\}[^>]*></textarea>)", r"\1" + scan_btn_block, m)
                  with open(modals_path, "w", encoding="utf-8") as f:
                      f.write(m)

          # 8. Применяем базовую тёмную палитру Google Pixel 5 (Material You Dark)
          app_svelte = "frontend/src/App.svelte"
          if os.path.exists(app_svelte):
              with open(app_svelte, "r", encoding="utf-8") as f:
                  ap = f.read()
              pixel_css = """
              :global(:root) {
                  --bg-primary: #121212 !important;
                  --bg-secondary: #1E1F22 !important;
                  --bg-tertiary: #28292D !important;
                  --accent: #8AB4F8 !important;
                  --text-primary: #E3E3E3 !important;
                  --text-secondary: #9AA0A6 !important;
              }
              :global(body), :global(.app-container), :global(.login-screen), :global(.content-area) {
                  background: #121212 !important;
                  color: #E3E3E3 !important;
              }
              :global(.sidebar), :global(.glass-panel), :global(.settings-card), :global(.modal-content) {
                  background: #1E1F22 !important;
                  backdrop-filter: none !important;
                  border: 1px solid rgba(255,255,255,0.05) !important;
                  border-radius: 24px !important;
                  box-shadow: none !important;
              }
              :global(.btn-primary), :global(.btn-primary-premium) {
                  background: #8AB4F8 !important;
                  color: #062E6F !important;
                  border-radius: 100px !important;
                  font-weight: 700 !important;
                  box-shadow: none !important;
              }
          </style>"""
              if "--accent: #8AB4F8" not in ap:
                  ap = ap.replace("</style>", pixel_css, 1)
                  with open(app_svelte, "w", encoding="utf-8") as f:
                      f.write(ap)
              print("[OK] Применена тёмная палитра Google Pixel 5 (Material You)")
          PYEOF
          python3 apply_hydra_patch.py
          rm -f apply_hydra_patch.py
          gofmt -w internal/ mobile/

      - name: Commit patched files back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Auto-apply Hydra Patch (True E2EE, Signed Nicknames, Loopback Check, Pixel 5 UI) [skip ci]"
            git push
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Generate Signing Key & Build Signed APK
        working-directory: ./android
        run: |
          rm -f app/release-key.jks
          keytool -genkey -v -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias teleghost -storepass teleghostpass -keypass teleghostpass \
            -dname "CN=TeleGhost, OU=Private, O=TeleGhost, L=City, S=State, C=US"
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
